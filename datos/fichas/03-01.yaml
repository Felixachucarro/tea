  - campo: Inauguración
    valor: >-
      18 de octubre de 2007, entre Once y Caseros.


      La Serie 300 de los Alstom Metrópolis es un número de vehículos
      subterráneos fabricados por Alstom en Brasil para su uso en el Subte de
      Buenos Aires. Se utilizan en las Líneas D y H, siendo esta última la única
      cuya flota está compuesta en su totalidad por esta unidad. En la red,
      estos coches constituyen la gran mayoría de la flota, que reemplazaron a
      los antiguos coches Siemens O&K  en la Línea H y los coches Fiat-Materfer
      en la D. Esta última también opera con una generación anterior de la Serie
      300 de Alstom Metrópolis, la Serie 100.
